name: Story
description: A capability. Implemented directly if it fits one session, otherwise split into task sub-issues.
title: "type(scope): "
labels: ["story"]
body:
  - type: markdown
    attributes:
      value: |
        Prefill only. **The contract is `AGENTS.md` → "Issue shape"** — the body budget, the split
        rule, and what belongs in the body live there and nowhere else. If this form disagrees with
        it, it wins and this form is the bug.

  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Also set the native relationship field — that is the source of truth.
      placeholder: "#151"

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Declarative. No implementation steps.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: One line.
    validations:
      required: true

  - type: textarea
    id: touchpoints
    attributes:
      label: Touchpoints
      description: Expected files, `path:line` where known.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: By pointer.

  - type: textarea
    id: success-signals
    attributes:
      label: Success signals
      description: Runnable, no human judgment. If split, these hold once all children land — each child still carries its own.
      value: |
        - (one that fails on `main` before the work)
        - `npm run build && npm test && npm run lint` green.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Child issue numbers. Create them as native sub-issues — this list is the human-readable cue. Blank if implementing directly.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links only.
