name: Task
description: One agent session, one PR, one reviewable diff.
title: "type(scope): "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Prefill only. **The contract is `AGENTS.md` → "Issue shape"** — the body budget, the split
        rule, and what belongs in the body live there and nowhere else. If this form disagrees with
        it, it wins and this form is the bug.

  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Also set the native relationship field — that is the source of truth.
      placeholder: "#178"

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Declarative. No implementation steps.
      placeholder: "`git_root` is removed from `NoteRevision['scope']`, so a note carries only its derived `project_slug` and the portable `git_remote`."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: One line.
    validations:
      required: true

  - type: textarea
    id: touchpoints
    attributes:
      label: Touchpoints
      description: Expected files, `path:line` where known.
      placeholder: |
        - `src/note.ts:43`
        - `src/distill/llmDistiller.ts:145`
        - `schema/note.md:31`
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: By pointer.
      placeholder: |
        - Event-side `git_root` (`src/hook/resource.ts:23`) is out of scope and must keep working.
        - spec §4 — structural invariants hold by construction.

  - type: textarea
    id: success-signals
    attributes:
      label: Success signals
      description: Runnable, no human judgment.
      value: |
        - (one that fails on `main` before the work)
        - `npm run build && npm test && npm run lint` green.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links only.
